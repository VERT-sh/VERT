name: Docker Image CI

on:
    push:
        branches: ["main"]
        tags: ["v*"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write

        steps:
            - uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,format=long,prefix=sha-
                      type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      PUB_ENV=production
                      PUB_HOSTNAME=${{ vars.PUB_HOSTNAME || '' }}
                      PUB_PLAUSIBLE_URL=${{ vars.PUB_PLAUSIBLE_URL || '' }}
                      PUB_VERTD_URL=${{ vars.PUB_VERTD_URL || '' }}
                      PUB_DISABLE_ALL_EXTERNAL_REQUESTS=${{ vars.PUB_DISABLE_ALL_EXTERNAL_REQUESTS || 'true' }}
                      PUB_DONATION_URL=https://donations.vert.sh
                      PUB_STRIPE_KEY=pk_live_51TlrPaFTPjkhEGBSu5Kwy5jJQYxcX5yUUHXiH5g7Xzvb0NKzDqbooc126HjlW35uUkfAgQN2ruEoCuyQynoxpKaA00ojFgQ116

    deploy-to-azure:
        needs: build-and-push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_CONTAINER_APP_NAME != ''
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Log in to Azure with OIDC
              uses: azure/login@v2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Install Container Apps CLI extension
              run: az extension add --name containerapp --upgrade

            - name: Configure GHCR image pull credentials
              env:
                  GHCR_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
                  GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
              run: |
                  az containerapp registry set \
                    --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
                    --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                    --server ghcr.io \
                    --username "$GHCR_USERNAME" \
                    --password "$GHCR_TOKEN"

            - name: Deploy commit image
              env:
                  GHCR_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
              run: |
                  az containerapp update \
                    --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
                    --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
                    --image "$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"
